name: CI

on:
  push:
    branches:
    - '**'
    paths-ignore:
    - '**.md'
    tags-ignore:
    - 'v**' # Don't run CI tests on release tags

env:
  # Maximum number of e2e runs at a time: they share the quotas (NLBs, SKS clusters)
  # of the Exoscale organization they run in.
  E2E_SLOTS: 5

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make go.mk
      - uses: ./go.mk/.github/actions/setup

      - uses: ./go.mk/.github/actions/pre-check

      - name: Run tests
        run: make test-verbose

  # Assigns each run one of E2E_SLOTS e2e slots, round-robin.
  e2e-slot:
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.slot.outputs.slot }}
    steps:
      - id: slot
        shell: bash
        run: echo "slot=$(( ${{ github.run_number }} % E2E_SLOTS ))" >> "$GITHUB_OUTPUT"

  e2e-test:
    needs: e2e-slot
    # One e2e run at a time per slot: the others wait for their turn (up to 100 per slot).
    concurrency:
      group: e2e-slot-${{ needs.e2e-slot.outputs.slot }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ginkgo
        shell: bash
        run: go install github.com/onsi/ginkgo/v2/ginkgo@latest

      - name: Run E2E tests
        shell: bash
        env:
          EXOSCALE_API_KEY: ${{ secrets.EXOSCALE_API_KEY }}
          EXOSCALE_API_SECRET: ${{ secrets.EXOSCALE_API_SECRET }}
          EXOSCALE_API_ZONE: ch-gva-2
        run: |
            cd e2e
            go install github.com/onsi/ginkgo/v2/ginkgo@latest
            ~/go/bin/ginkgo -v --timeout=30m

  build:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make go.mk
      - uses: ./go.mk/.github/actions/setup
      - name: Build
        run: make build

  docker-build:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make go.mk
      - uses: ./go.mk/.github/actions/setup
      - name: Build Docker image
        run: make docker
