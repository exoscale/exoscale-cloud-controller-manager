# HTTP server on the nodes' network (both IPv4 and IPv6, port 8080), like a hostNetwork
# Ingress/Gateway data plane, exposed over IPv4 (NodePort) and IPv6 (port 8080) by a dual-stack NLB.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: whoami-hostnetwork
  labels:
    app: whoami-hostnetwork
spec:
  selector:
    matchLabels:
      app: whoami-hostnetwork
  template:
    metadata:
      labels:
        app: whoami-hostnetwork
    spec:
      hostNetwork: true
      containers:
      - name: whoami
        image: traefik/whoami:v1.10
        args: ["--port", "8080"]
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-dualstack
  annotations:
    service.beta.kubernetes.io/exoscale-loadbalancer-service-instancepool-id: "${exoscale_instance_pool_id}"
    service.beta.kubernetes.io/exoscale-loadbalancer-ip-address-type: "dualstack"
    service.beta.kubernetes.io/exoscale-loadbalancer-ipv6-target-ports: "80:8080"
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: whoami-hostnetwork
